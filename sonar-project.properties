# Project identification
sonar.projectKey=xasm-plus-plus
sonar.projectName=xasm++ - Modern Modular Cross-Assembler
sonar.projectVersion=1.0.0

# Local SonarQube server
sonar.host.url=http://localhost:9000
# NOTE: Store authentication token in sonar-project.local.properties (gitignored)
#       or export SONAR_TOKEN environment variable

# Source and test directories
sonar.sources=src,include
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C++ plugin (sonar-cxx community plugin)
# Plugin: https://github.com/SonarOpenCommunity/sonar-cxx
# NOTE: sonar.cfamily.* properties are for Developer Edition CFamily plugin only

# File suffixes to analyze (sonar-cxx defaults to a broken pattern on some versions)
sonar.cxx.file.suffixes=.cpp,.cxx,.cc,.c,.hpp,.hxx,.hh,.h

# Use compile_commands.json for accurate include paths and defines
sonar.cxx.compiledb.reportPaths=build/compile_commands.json

# clang-tidy integration
sonar.cxx.clangtidy.reportPaths=build/clang-tidy-report.txt

# cppcheck integration (generate with: cppcheck --xml src/ 2>build/cppcheck-report.xml)
# sonar.cxx.cppcheck.reportPaths=build/cppcheck-report.xml

# Coverage report (Cobertura XML from gcovr, using build-coverage/ with ENABLE_COVERAGE=ON)
sonar.cxx.cobertura.reportPaths=build-coverage/coverage-cobertura.xml

# Exclusions
sonar.exclusions=**/build/**,**/build_*/**,**/.ai-pack/**,**/pop_analysis_output/**,**/_deps/**

# Test exclusions
sonar.test.exclusions=**/tests/**

# =============================================================================
# Complexity threshold raises (Task 5 — inherently complex but correct code)
# =============================================================================
#
# Rule: sonar.issue.ignore.multicriteria allows suppressing specific rules on
# specific files. Each rule needs a unique suffix (e1, e2, ...).
#
# Documented rationale for each suppression:
#   cpu_6809.cpp — 6809 has 16 addressing modes + dual-register variants;
#     EncodeInstruction and EncodeMemInstr dispatch is data-driven branching
#     that cannot be reduced without hiding the addressing-mode structure.
#   cpu_6502.cpp Encode* functions — each handles 4–8 addressing modes for one
#     mnemonic; the branching is 1-to-1 with the 6502 ISA and cannot be
#     simplified.
#   main.cpp CLI section — after Task 5 extraction, the residual complexity in
#     main() comes from the standard error-handler chain, not algorithmic
#     branching.

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e44,e45,e46,e47,e48,e49,e50,e51,e52,e53,e54,e55,e56,e57,e58,e59,e60,e61,e62,e63,e64,e65,e66,e67,e68,e69,e70,e71,e72,e73,e74,e75,e76,e77,e78,e79,e80,e81,e82,e83,e84,e85,e86,e87

